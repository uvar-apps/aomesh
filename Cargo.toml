[workspace]
resolver = "2"
members = ["crates/aomesh", "crates/aomesh-cli"]
default-members = ["crates/aomesh", "crates/aomesh-cli"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ugo Garetto"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvar-apps/aomesh"

[workspace.dependencies]
aomesh = { version = "0.3.0", path = "crates/aomesh" }
objserde = "0.2"
# Used only as a rasterizer for the validation image. It never reads or writes an
# OBJ here: the mesh it draws is assembled from the objserde model.
meshview = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rayon = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
